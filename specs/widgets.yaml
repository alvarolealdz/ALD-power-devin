# Example spec. Deliberately about nothing: swap it for a real one.
app: widgets
entity: widget
title: Widgets
description: Example app generated from a neutral spec.

fields:
  - name: label
    type: text
    required: true
    sample: words

  - name: quantity
    type: number

  - name: due_on
    type: date

  - name: active
    type: bool

  - name: status
    type: enum
    options: [draft, review, done]
    workflow: true
    open: [draft, review]
    tones: {draft: neutral, review: warning, done: success}

  - name: owner
    type: fk
    target: user

  - name: internal_note
    type: text
    sensitive: true
    sample: sentence
