app: refunds
entity: refund
title: Refunds dashboard
singular: refund
description: Customer refund requests waiting for approval and processing.

fields:
  - name: transaction_ref
    type: text
    required: true
    sample: reference

  - name: customer_ref
    type: text
    required: true
    sensitive: true
    sample: reference

  - name: amount
    type: number
    required: true
    decimals: 2
    unit_field: currency
    sample: {min: 5, max: 2500}

  - name: currency
    type: text
    required: true
    sample: [EUR, GBP, USD, CHF]

  - name: reason
    type: text
    sample:
      - Duplicate charge
      - Item never arrived
      - Subscription cancelled before renewal
      - Incorrect amount charged
      - Damaged item received
      - Order was cancelled
      - Returned item not yet credited
      - Promotional price was not applied
      - Service was unavailable
      - Payment was made twice

  - name: status
    type: enum
    required: true
    options: [pending, approved, denied, processed]
    workflow: true
    open: [pending]
    transitions:
      pending: [approved, denied]
      approved: [processed]
      denied: []
      processed: []
    tones: {pending: warning, approved: info, denied: danger, processed: success}

  - name: requested_on
    type: date

  - name: approver
    type: fk
    target: user
