app: kyc_queue
entity: kyc_review
title: KYC review queue

fields:
  - name: customer_name
    type: text
    required: true
    sensitive: true

  - name: customer_ref
    type: text
    required: true
    sensitive: true

  - name: risk_score
    type: number

  - name: status
    type: enum
    required: true
    options: [pending, approved, rejected, escalated]

  - name: submitted_on
    type: date

  - name: reviewer
    type: fk
    target: user

  - name: notes
    type: text
