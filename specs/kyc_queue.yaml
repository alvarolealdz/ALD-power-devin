app: kyc_queue
entity: kyc_review
title: KYC review queue
singular: KYC review
description: Customer due-diligence cases waiting for a reviewer's decision.

fields:
  - name: customer_name
    type: text
    required: true
    sensitive: true
    sample: person_name

  - name: customer_ref
    type: text
    required: true
    sensitive: true
    sample: reference

  - name: risk_score
    type: number
    decimals: 0
    sample: {min: 1, max: 100}

  - name: status
    type: enum
    required: true
    options: [pending, approved, rejected, escalated]
    workflow: true
    open: [pending, escalated]
    transitions:
      pending: [approved, rejected, escalated]
      escalated: [approved, rejected]
      approved: []
      rejected: []
    tones: {pending: warning, approved: success, rejected: danger, escalated: info}

  - name: submitted_on
    type: date

  - name: reviewer
    type: fk
    target: user

  - name: notes
    type: text
    sample:
      - Passport expired, awaiting new scan
      - Source of funds letter received
      - PEP screening clear
      - Address document needs a clearer image
      - Name matched supporting documents
      - Waiting for translated identification
      - Additional income evidence requested
      - Screening completed with no concerns
      - Reviewer left a follow-up question
      - Documents verified against the submitted profile
