app: vendor_contracts
entity: vendor_contract
title: Vendor contracts
singular: vendor contract
description: Supplier agreements, their renewal dates and who owns them.

fields:
  - name: vendor_name
    type: text
    required: true
    sample: company

  - name: contract_ref
    type: text
    required: true
    sample: reference

  - name: annual_value
    type: number
    sensitive: true
    decimals: 0
    sample: {min: 5000, max: 250000}

  - name: renewal_date
    type: date

  - name: owner
    type: fk
    target: user

  - name: status
    type: enum
    required: true
    options: [active, expiring, renewed, terminated]
    workflow: true
    open: [active, expiring]
    tones: {active: success, expiring: warning, renewed: info, terminated: danger}

  - name: notes
    type: text
    sample:
      - Auto-renews unless cancelled 60 days prior
      - Pricing review due at renewal
      - Insurance certificate is on file
      - Service levels are reviewed quarterly
      - Renewal owner should confirm updated terms
      - Agreement includes a transition assistance clause
      - Legal review completed before signature
      - Payment schedule follows the annual anniversary
