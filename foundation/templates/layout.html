<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% if title %}{{ title }} · PowerDevin{% else %}PowerDevin{% endif %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">{{ brand|default("PowerDevin") }}</a>
      <nav class="nav">
        {% for entry in nav_apps|default([]) %}
          <a class="{% if request.url.path.startswith(entry.path) %}active{% endif %}" href="{{ entry.path }}">{{ entry.title }}</a>
        {% endfor %}
      </nav>
      {% include "partials/user_switcher.html" %}
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script>
      document.addEventListener("submit", (event) => {
        const message = event.target.dataset.confirm;
        if (message && !window.confirm(message)) event.preventDefault();
      });
      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-autosubmit]")) event.target.form.requestSubmit();
      });
    </script>
  </body>
</html>
