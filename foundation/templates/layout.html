<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ title|default("Foundation") }}{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">{{ brand|default("Foundation") }}</a>
      {% include "partials/user_switcher.html" %}
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
