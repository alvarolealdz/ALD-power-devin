<dl class="record">
  {% for item in items %}
    <div class="record-item">
      <dt>{{ item.label }}</dt>
      {% if item.kind|default("text") == "badge" %}
        <dd>{% set badge = item.value %}{% include "partials/badge.html" %}</dd>
      {% elif item.value is none or item.value == "" %}
        <dd class="muted">—</dd>
      {% else %}
        <dd>{{ item.value }}</dd>
      {% endif %}
    </div>
  {% endfor %}
</dl>
